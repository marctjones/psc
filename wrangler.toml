name = "sovereign"
main = "crates/sovereign-worker/src/lib.rs"
compatibility_date = "2024-01-01"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "sovereign-db"
database_id = "YOUR_DATABASE_ID_HERE"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sovereign-media"

[vars]
ENVIRONMENT = "production"
