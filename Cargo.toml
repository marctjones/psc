[workspace]
resolver = "2"
members = [
    "crates/sovereign-cli",
    "crates/sovereign-worker",
    "crates/sovereign-core",
    "crates/sovereign-reader",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/marctjones/psc"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
sha2 = "0.10"
